name: OFFO Daily News Engine

on:
  schedule:
    - cron: '0 11 * * *'  # 6:00 AM EST = 11:00 AM UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  run-news-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/news-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/news-engine/requirements.txt

      - name: Run daily news engine
        working-directory: tools/news-engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python daily_news_engine.py
