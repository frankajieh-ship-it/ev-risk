name: OFFO Daily Recall Scanner

on:
  schedule:
    - cron: '30 11 * * *'  # 6:30 AM EST = 11:30 AM UTC (30 min after news engine)
  workflow_dispatch:         # allow manual trigger from GitHub Actions UI

jobs:
  run-recall-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/recall-scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/recall-scanner/requirements.txt

      - name: Run recall scanner
        working-directory: tools/recall-scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: python recall_scanner.py
