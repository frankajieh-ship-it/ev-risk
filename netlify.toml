[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["openai"]

# Extend default timeout for AI-heavy API routes (max 26s on Pro)
[functions."*"]
  timeout = 26

# Use esbuild for our custom render-pdf function (bundles @react-pdf into the function)
[functions.render-pdf]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
