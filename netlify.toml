[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  TURBOPACK_CACHE_VERSION = "3"
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Extend function timeout for AI-heavy API routes (Netlify default max: 60s)
[functions."*"]
  timeout = 60

# Use esbuild for our custom render-pdf function (bundles @react-pdf into the function)
[functions.render-pdf]
  node_bundler = "esbuild"

# Background function: AI receipt upgrade (no sync timeout — runs up to 15 minutes)
[functions.upgrade-receipt-background]
  timeout = 900
  external_node_modules = ["openai"]

# Background function: per-receipt photo analysis via GPT-4o Vision
[functions.analyze-receipt-photos]
  timeout = 900
  external_node_modules = ["openai", "@anthropic-ai/sdk"]

# Background function: bulk rescore all curated_deals with AI (runs up to 15 minutes)
[functions.rescore-all-deals]
  timeout = 900

# Scheduled function: daily email nudge sender (runs at 10:00 UTC)
[functions.send-nudge-emails]
  timeout = 30

# Scheduled function: daily deal watch price-drop scanner (runs at 09:00 UTC)
[functions.scan-deal-watch]
  timeout = 60

# Scheduled function: daily activation email sender (runs at 10:30 UTC)
[functions.send-activation-emails]
  timeout = 50

# Scheduled function: daily win-back email sender (runs at 11:00 UTC)
[functions.send-win-back-emails]
  timeout = 60

# Scheduled function: conversion email sender (runs every 4 hours)
[functions.send-conversion-emails]
  timeout = 60

# Scheduled function: weekly digest sender (Mondays at 13:00 UTC)
[functions.send-weekly-digest]
  timeout = 60

# Scheduled function: receipt upgrade retry scanner (every 5 minutes)
# Detects failed/stuck upgrade jobs and re-enqueues them with exponential backoff.
# Dead-letters jobs after 3 failed attempts and fires an ops alert.
[functions.scan-stuck-upgrades]
  timeout = 60

# Scheduled function: AI health monitor (every 5 minutes)
# Checks 30-min rolling success rate of ai_job_succeeded/failed events.
# Fires Slack alert when success rate drops below 85% (min 3 samples).
[functions.health-check-ai]
  timeout = 60

# Canonical domain: redirect www → non-www at Netlify edge before app sees the request.
# Without this, Next.js issues a 301 for every /api/img?url=... request from www,
# causing browser <img> tags to follow a redirect chain that can fail silently.
[[redirects]]
  from = "https://www.offolab.com/*"
  to = "https://offolab.com/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
