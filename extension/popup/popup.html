<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>OFFO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      padding: 16px;
      background: #fafafa;
      color: #1f2937;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #eef2ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4f46e5;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }
    .subtitle {
      font-size: 11px;
      color: #6b7280;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 14px;
      padding: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider {
      background: #4f46e5;
    }
    .toggle input:checked + .toggle-slider::after {
      transform: translateX(16px);
    }
    .link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #4f46e5;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .link:hover {
      background: #eef2ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12l2 2 4-4"/>
        <circle cx="12" cy="12" r="10"/>
      </svg>
    </div>
    <div>
      <div class="title">OFFO</div>
      <div class="subtitle">Used Car Deal Checker</div>
    </div>
  </div>

  <div class="info">
    Browse a <strong>CarGurus EV listing</strong> to see the deal check badge. Click it for a full receipt with risk flags, fair price, and must-ask questions.
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Show badge on EV listings</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <a href="https://offolab.com/receipt" target="_blank" class="link">
    Open OFFO Receipt Checker
  </a>

  <script src="popup.js"></script>
</body>
</html>
